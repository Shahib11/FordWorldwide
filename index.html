<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FourFold Worldwide | London to Southampton Cruise Port VIP Private Transfers</title>
    <meta name="description" content="Exclusive VIP private chauffeur transfers between London, Heathrow, Gatwick and Southampton Cruise Terminals. Luxury Mercedes-Benz V-Class, Luxury SUVs, and Standard Executive SUVs." />
    <meta name="keywords" content="London to Southampton transfer, Southampton cruise port chauffeur, Mercedes V Class cruise transfer, VIP SUV Heathrow Southampton, FourFold Worldwide, cruise terminal private driver" />
    
    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="FourFold Worldwide | VIP Southampton Cruise & London Transfers" />
    <meta property="og:description" content="Bespoke VIP private chauffeur services between London airports, central hotels, and Southampton cruise terminals in Mercedes V-Class & Executive SUVs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FourFold Worldwide | VIP Southampton Cruise Transfers" />
    <meta name="twitter:description" content="Door-to-ship luxury transfers for cruise passengers in Mercedes V-Class and Luxury SUVs." />
    <meta name="theme-color" content="#0B1120" />

    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090D16] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <!-- Netlify Form Detection: Hidden static HTML form ensures Netlify automatically detects and processes form submissions -->
    <form name="fourfold-booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="fourfold-booking" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="serviceType" />
      <input type="text" name="pickupLocation" />
      <input type="text" name="dropoffLocation" />
      <input type="text" name="pickupDate" />
      <input type="text" name="pickupTime" />
      <input type="text" name="vehicleCategory" />
      <input type="text" name="passengerCount" />
      <input type="text" name="luggageCount" />
      <input type="text" name="cruiseShipOrFlight" />
      <input type="text" name="tourAddon" />
      <input type="text" name="childSeats" />
      <textarea name="specialRequests"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
